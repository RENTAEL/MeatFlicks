# Netlify mirror deployment for Streamium (SvelteKit + adapter-auto).
# adapter-auto detects Netlify at build time and emits adapter-netlify output
# (static assets + a single "render" Netlify Function for SSR/API routes).
# Functions are produced by the adapter — no manual [functions] config needed.

[build]
	command = "npm run build"
	publish = "build"

[build.environment]
	NODE_VERSION = "20"
