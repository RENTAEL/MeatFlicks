# Netlify mirror deployment for Streamium (SvelteKit + adapter-auto).
# adapter-auto detects Netlify at build time and emits adapter-netlify output
# (static assets + a single "render" Netlify Function for SSR/API routes).
# Functions are produced by the adapter â€” no manual [functions] config needed.

[build]
	command = "npm run build"
	publish = "build"

[build.environment]
	NODE_VERSION = "20"


[[headers]]
  for = "/sounds/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/demon-slayer-aftermidnight.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
