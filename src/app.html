<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<script>
			(function () {
				try {
					var theme = localStorage.getItem('streamium-theme');
					if (theme) document.documentElement.setAttribute('data-theme', theme);
				} catch (e) {}
			})();
		</script>
		<script>
			if ('serviceWorker' in navigator) {
				navigator.serviceWorker
					.register('/service-worker.js', { scope: '/' })
					.catch(function (err) {
						console.warn('Service worker registration failed:', err);
					});
			}
		</script>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="format-detection" content="telephone=no" />
		<meta name="color-scheme" content="dark" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
		<link rel="manifest" href="/manifest.json" />
		<meta name="theme-color" content="#0a0a1a" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Streamium" />
		<link rel="apple-touch-icon" href="/icon-192.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" style="overflow-x: hidden; max-width: 100vw">
		<div id="cosmic-bg">
			<div id="nebula-1"></div>
			<div id="nebula-2"></div>
			<div id="nebula-3"></div>
			<div id="stars-canvas"></div>
			<div id="parallax-layer"></div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			(function () {
				var style = [
					'color: #c94b8c',
					'font-size: 20px',
					'font-weight: bold',
					'padding: 8px 0'
				].join(';');

				var sub = ['color: #9898ab', 'font-size: 13px', 'font-style: italic'].join(';');

				var link = ['color: #7c5cfc', 'font-size: 13px', 'text-decoration: underline'].join(';');

				console.log(
					'%c\n ╔═══════════════════════════════════╗\n ║                                   ║\n ║     🎬  S T R E A M I U M        ║\n ║                                   ║\n ╚═══════════════════════════════════╝',
					style
				);

				console.log('%c👋 Hey there, fellow nerd! You found the secret console.', sub);
				console.log(
					'%cThis whole thing was hand-built by the developer — one developer, too much coffee, and a questionable amount of Stack Overflow tabs.',
					sub
				);
				console.log('%c', '');
				console.log("%cIf you find a bug, no you didn't. 😎", sub);
				console.log("%cBut seriously — welcome. Poke around. Just don't break the login.", sub);
				console.log('%c', '');
				console.log('%c— the developer, your friendly neighborhood solo dev', link);
				console.log('%c', '');
				console.log(
					"%cP.S. If you're reading this instead of watching content, go watch something. 🍿",
					'color: #66667a; font-size: 11px;'
				);
			})();
		</script>
	</body>
</html>
