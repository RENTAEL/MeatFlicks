name = "streamium-watch-party"
main = "src/worker.ts"
compatibility_date = "2024-12-01"

# Durable Objects (free tier includes DOs with SQLite storage)
[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

# Lock down to the real frontend (comma-separated list is fine via multiple entries)
[vars]
ALLOWED_ORIGINS = "https://streamium-cosmic.vercel.app,http://localhost:5173"
MAX_ROOM_LIFETIME_MS = "1800000"
